<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xenolith: which products embed this component?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 2 29 9v14L16 30 3 23V9z%22 fill=%22%232f6f6a%22/%3E%3Cpath d=%22M12 12h8v8h-8z%22 fill=%22%23f7f7f5%22/%3E%3C/svg%3E">
<meta name="description" content="Open census of which commercial and closed-source products embed which third-party components, with sourced vendor and tracker statements.">
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1b1d1f; --muted: #5d636a; --line: #e3e3df;
    --accent: #2f6f6a; --accent-ink: #ffffff; --chip: #eeeeea;
    --affected: #b42318; --workaround: #b54708; --fixed: #067647; --investigating: #8a6a00;
    --runtime: #175cd3; --present: #6941c6; --neutral: #667085;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121416; --panel: #1b1e21; --ink: #e8e9ea; --muted: #a0a6ad; --line: #2c3035;
      --accent: #5fb3ab; --accent-ink: #0d1f1d; --chip: #262a2e;
      --affected: #f97066; --workaround: #fdb022; --fixed: #47cd89; --investigating: #e5c454;
      --runtime: #84adff; --present: #b692f6; --neutral: #98a2b3;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
  header { padding: 28px 0 8px; }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  .brand h1 a { color: inherit; text-decoration: none; }
  .brand p { margin: 0; color: var(--muted); }
  .search { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0; }
  .search input { width: 100%; font: inherit; font-size: 17px; padding: 13px 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .hint { color: var(--muted); font-size: 14px; margin: 6px 2px 0; }
  main { padding-bottom: 40px; min-height: 50vh; }
  h2 { font-size: 20px; margin: 20px 0 8px; letter-spacing: -0.01em; }
  h3 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  button.card { text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
  button.card:hover { border-color: var(--accent); }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 6px 0 2px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px;
    padding: 5px 11px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip[aria-pressed="true"] .muted { color: inherit; opacity: .85; }
  .badge { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    border: 1px solid currentColor; white-space: nowrap; }
  .v-affected { color: var(--affected); } .v-workaround { color: var(--workaround); }
  .v-fixed { color: var(--fixed); } .v-under_investigation { color: var(--investigating); }
  .v-runtime_dependent { color: var(--runtime); } .v-present { color: var(--present); }
  .v-not_affected, .v-absent, .v-unknown { color: var(--neutral); }
  .row { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .row .grow { min-width: 0; flex: 1; }
  .supplier { color: var(--muted); font-size: 14px; }
  .product { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13.5px; margin-top: 6px; overflow-wrap: anywhere; }
  .guess { display: grid; grid-template-columns: minmax(110px, 30%) 1fr; gap: 2px 10px; padding: 6px 0; border-top: 1px dashed var(--line); font-size: 13.5px; }
  .guess:first-of-type { border-top: 0; }
  .conf { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); margin-left: 4px; }
  .conf-named { color: var(--present); border-color: var(--present); }
  .conf-likely { color: var(--workaround); border-color: var(--workaround); }
  .conf-possible { color: var(--neutral); }
  .wanted-flag { border-left: 3px solid var(--workaround); padding: 8px 12px; margin: 12px 0; background: var(--panel); border-radius: 6px; font-size: 14px; }
  .cves { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .cve { white-space: nowrap; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip);
    border-radius: 6px; padding: 2px 6px; }
  details { margin-top: 6px; } summary { cursor: pointer; color: var(--muted); font-size: 13.5px; }
  .list { display: grid; gap: 8px; }
  .filter { width: 100%; font: inherit; padding: 9px 12px; border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); margin: 4px 0 10px; }
  .more { margin: 14px auto 0; display: block; }
  .back { background: none; border: 0; color: var(--accent); font: inherit; padding: 0; cursor: pointer; margin-top: 8px; }
  .notice { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--panel); border-radius: 0 var(--radius) var(--radius) 0; }
  footer { border-top: 1px solid var(--line); padding: 20px 0 40px; color: var(--muted); font-size: 14px; }
  footer h2 { color: var(--ink); font-size: 16px; }
  footer ul { padding-left: 18px; margin: 6px 0; }
  .comp-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .kbd { font-family: ui-monospace, monospace; font-size: 13px; background: var(--chip); padding: 1px 5px; border-radius: 5px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* tabs */
  .tabs { display: flex; gap: 2px; margin-top: 14px; border-bottom: 1px solid var(--line); }
  .tabs a { padding: 8px 12px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 15px;
    border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a:hover { color: var(--ink); }
  .tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
  /* "Why it matters" tab */
  .why section { margin: 34px 0 0; }
  .why h2 { font-size: 22px; margin: 2px 0 10px; }
  .why h3 { font-size: 16px; }
  .kicker { margin: 0; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
  .lede { font-size: 18px; }
  .grid3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .hero { display: grid; grid-template-columns: 1fr 170px; gap: 24px; align-items: center; margin-top: 18px; }
  .hero h2 { font-size: 30px; letter-spacing: -0.02em; margin: 4px 0 8px; }
  .art { width: 100%; height: auto; }
  .fact b { display: block; font-size: 30px; line-height: 1.15; letter-spacing: -0.01em; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .fact.risk b { color: var(--affected); } .fact.good b { color: var(--accent); }
  .fact .src { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .num { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1; }
  .cite { font-size: 11px; vertical-align: super; line-height: 0; text-decoration: none; margin-left: 1px; }
  .callout { background: var(--ink); color: var(--bg); border-radius: var(--radius); padding: 14px 16px; margin-top: 10px; }
  .callout b { color: inherit; }
  .callout .cite { color: inherit; opacity: .8; }
  .quote { font-size: 21px; font-style: italic; line-height: 1.35; margin: 4px 0 8px; }
  .timeline { list-style: none; margin: 4px 0 0 7px; padding: 0; border-left: 2px solid var(--line); }
  .timeline li { position: relative; padding: 0 0 16px 22px; }
  .timeline li::before { content: ""; position: absolute; left: -8px; top: 5px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--affected); border: 2px solid var(--bg); }
  .timeline .year { font-weight: 700; font-variant-numeric: tabular-nums; margin-right: 6px; }
  .timeline .tag { color: var(--accent); font-size: 13px; font-weight: 600; }
  .takeaway { font-style: italic; font-size: 18px; color: var(--accent); margin: 4px 0 0; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tbl { width: 100%; min-width: 660px; border-collapse: collapse; font-size: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .tbl th, .tbl td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .tbl thead th { background: var(--chip); font-size: 13px; }
  .tbl tr:last-child td { border-bottom: 0; }
  .yes { color: var(--fixed); font-weight: 700; } .no { color: var(--affected); font-weight: 700; } .unk { color: var(--neutral); font-weight: 700; }
  .cols2 { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card ul { margin: 6px 0 0; padding-left: 18px; }
  .card li { margin: 3px 0; }
  .meter { display: inline-flex; gap: 3px; align-items: flex-end; height: 22px; margin-right: 8px; vertical-align: middle; }
  .meter i { display: block; width: 6px; border-radius: 1px; background: var(--line); }
  .meter i.on { background: var(--accent); }
  .lvl-top { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .bars { display: grid; gap: 8px; margin-top: 6px; }
  .bars .row { align-items: center; font-size: 14px; }
  .bars .lab { width: 170px; flex: none; }
  .bars .track { flex: 1; background: var(--chip); border-radius: 4px; height: 14px; }
  .bars .fill { height: 14px; border-radius: 4px; min-width: 3px; }
  .bars .val { width: 40px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .sources li { margin: 4px 0; overflow-wrap: anywhere; }
  .scroll-hint { display: none; color: var(--muted); font-size: 13px; margin: 0 0 4px; }
  @media (max-width: 640px) {
    .hero { grid-template-columns: 1fr; } .hero .art { display: none; }
    .hero h2 { font-size: 26px; } .bars .lab { width: 120px; } .scroll-hint { display: block; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1><a href="#" id="home-link">Xenolith</a></h1>
      <p>Which commercial products embed this component?</p>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#" data-tab="census" id="tab-census">Census</a>
      <a href="#why" data-tab="why">Why it matters</a>
    </nav>
  </header>
  <div class="search" role="search">
    <label for="q" class="muted small">Search a component, CVE, vendor or product</label>
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="php, brotli, CVE-2021-44228, Cisco, FortiGate…">
    <p class="hint" id="status">Loading census…</p>
  </div>
  <main id="app" aria-live="polite"></main>
  <footer id="footer"></footer>
</div>
<script>
"use strict";
const VERDICTS = {
  affected: "Affected", workaround: "Workaround only", fixed: "Fix released",
  under_investigation: "Investigating", runtime_dependent: "Uses host runtime",
  present: "Contains (not assessed)", not_affected: "Not affected", absent: "Not present", unknown: "No status"
};
const CONTAINS = new Set(["affected", "workaround", "fixed", "present"]);
const EVIDENCE = {
  "tracker": "Incident tracker", "vendor-advisory": "Vendor advisory", "vendor-sbom": "Vendor SBOM",
  "notices-file": "Third-party notices", "binary-scan": "Binary scan", "community": "Community submission"
};
const FILTERS = [
  ["all", "All", () => true],
  ["contains", "Contains it", r => CONTAINS.has(r.st)],
  ["affected", "Affected", r => r.st === "affected" || r.st === "workaround"],
  ["fixed", "Fix released", r => r.st === "fixed"],
  ["under_investigation", "Investigating", r => r.st === "under_investigation"],
  ["not_affected", "Not affected / not present", r => r.st === "not_affected" || r.st === "absent"],
  ["runtime_dependent", "Host runtime", r => r.st === "runtime_dependent"],
  ["in_range", "Vulnerable version listed", r => r.rc === "in_range"],
];
const PAGE = 50;
const REPO = "https://github.com/benheise/Xenolith";

let META = null, PRODUCTS = [], PINDEX = [], SOURCES = {}, PBYKEY = new Map();
let INVINDEX = null;   // lazy: component name -> products listing it in their notices
const compCache = new Map();
const $ = s => document.querySelector(s);
const app = $("#app"), input = $("#q"), statusEl = $("#status");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
function link(u, text) {
  const s = safeUrl(u);
  return s ? `<a href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(text || hostOf(s))}</a>` : esc(text || "");
}
function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } }
function badge(st) { return `<span class="badge v-${esc(st)}">${esc(VERDICTS[st] || st)}</span>`; }
function fmt(n) { return Number(n || 0).toLocaleString("en-US"); }
function norm(s) { return String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, ""); }

async function loadJSON(path) {
  const r = await fetch(path, { cache: "no-cache" });
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}
async function component(id) {
  if (!compCache.has(id)) compCache.set(id, loadJSON(`data/components/${encodeURIComponent(id)}.json`));
  return compCache.get(id);
}

// ---------------------------------------------------------------- routing
function parseHash() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  return { c: h.get("c"), p: h.get("p"), q: h.get("q"), w: h.get("w"), why: h.has("why"), f: h.get("f") || "all", t: h.get("t") || "" };
}
function setTab(name) {
  document.querySelectorAll(".tabs a").forEach(a => {
    if (a.dataset.tab === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}
function go(params, replace = false) {
  const h = new URLSearchParams();
  for (const [k, v] of Object.entries(params)) if (v) h.set(k, v);
  const next = "#" + h.toString();
  if (replace) history.replaceState(null, "", next); else location.hash = next;
  if (replace) route();
}
window.addEventListener("hashchange", route);

let lastView = null;
function route() {
  if (!META) return;
  const { c, p, q, w, why, f, t } = parseHash();
  const view = c ? `c:${c}` : p ? `p:${p}` : q ? "q" : w ? "wanted" : why ? "why" : "home";
  if (view !== lastView) { window.scrollTo(0, 0); lastView = view; }
  setTab(view === "why" ? "why" : "census");
  if (view === "why") { input.value = ""; return showWhy(); }
  if (c && META.components.some(x => x.id === c)) { input.value = ""; return showComponent(c, f, t); }
  if (p) { input.value = ""; return showProduct(p); }
  if (q) { if (input.value !== q) input.value = q; return showSearch(q); }
  input.value = "";
  if (w) return showWanted(w);
  showHome();
}

let typingTimer = null;
input.addEventListener("input", () => {
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    const q = input.value.trim();
    go(q ? { q } : {}, true);
  }, 160);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const hit = exactComponent(input.value.trim());
    if (hit) go({ c: hit.id });
  }
});
$("#home-link").addEventListener("click", e => { e.preventDefault(); go({}); });
$("#tab-census").addEventListener("click", e => { e.preventDefault(); go({}); });

// ---------------------------------------------------------------- search
function componentTerms(comp) {
  const terms = [comp.id, comp.name, ...(comp.aliases || [])];
  for (const inc of comp.incidents || []) { terms.push(inc.name, ...(inc.cves || [])); }
  return terms.map(norm);
}
function exactComponent(q) {
  const n = norm(q);
  if (!n) return null;
  return META.components.find(c => componentTerms(c).includes(n)) || null;
}
function matchComponents(q) {
  const n = norm(q);
  return META.components.filter(c => componentTerms(c).some(t => t.includes(n)));
}
function matchProducts(q, limit = 60) {
  const tokens = norm(q).split(/\s+/).filter(Boolean);
  if (!tokens.length) return [];
  const out = [];
  for (let i = 0; i < PINDEX.length; i++) {
    if (tokens.every(t => PINDEX[i].includes(t))) out.push(PRODUCTS[i]);
  }
  out.sort((a, b) => (b.n > 0) - (a.n > 0) || (b.kev || 0) - (a.kev || 0) || (b.n - a.n));
  return { total: out.length, items: out.slice(0, limit) };
}

async function inventoryIndex() {
  if (!INVINDEX) INVINDEX = loadJSON("data/inventory_index.json").catch(() => ({ p: [], n: {} }));
  return INVINDEX;
}
function noticeMatches(idx, q) {
  const n = norm(q).trim();
  if (n.length < 2) return [];
  const names = Object.keys(idx.n);
  const exact = names.filter(x => x === n);
  const partial = n.length >= 3 ? names.filter(x => x !== n && (x.startsWith(n) || x.includes(n))).slice(0, 15) : [];
  return [...exact, ...partial].slice(0, 16);
}
function noticesSection(idx, hits) {
  if (!hits.length) return "";
  const blocks = hits.map(name => {
    const rows = idx.n[name];
    const byProduct = new Map();
    for (const [pi, pv, cv] of rows) {
      const key = idx.p[pi];
      if (!byProduct.has(key)) byProduct.set(key, []);
      byProduct.get(key).push([pv, cv]);
    }
    const items = [...byProduct.entries()].map(([key, vs]) => {
      const p = PBYKEY.get(key) || { s: "", p: key };
      const list = vs.slice(0, 6).map(([pv, cv]) => `${esc(pv || "?")}${cv ? ` → ${esc(cv)}` : ""}`).join(", ");
      return `<li><a href="#p=${encodeURIComponent(key)}">${esc(p.s)} ${esc(p.p)}</a> <span class="muted small">${list}${vs.length > 6 ? ` … +${vs.length - 6}` : ""}</span></li>`;
    }).join("");
    return `<div class="card"><h3><span class="kbd">${esc(name)}</span></h3>
      <div class="small muted">Listed by ${fmt(byProduct.size)} product${byProduct.size === 1 ? "" : "s"} (product version → component version)</div>
      <ul class="small" style="margin:6px 0 0;padding-left:18px">${items}</ul></div>`;
  }).join("");
  return `<h2>In vendor open source notices</h2>
    <p class="small muted">Any component name, not just the watchlist: these come from the full component lists vendors publish.</p>
    <div class="list">${blocks}</div>`;
}

async function showSearch(q) {
  const exact = exactComponent(q);
  const comps = matchComponents(q);
  const prods = matchProducts(q);
  const idx = await inventoryIndex();
  if (input.value.trim() !== q) return;   // a newer search replaced this one
  const nhits = noticeMatches(idx, q);
  statusEl.textContent = `${comps.length} component${comps.length === 1 ? "" : "s"}, ${fmt(prods.total)} product${prods.total === 1 ? "" : "s"}, ${nhits.length} notices name${nhits.length === 1 ? "" : "s"} match`;
  let html = "";
  if (exact) {
    html += `<div class="notice">“${esc(q)}” is <b>${esc(exact.name)}</b>. <a href="#c=${encodeURIComponent(exact.id)}">See every product that embeds it →</a></div>`;
  }
  if (comps.length) {
    html += `<h2>Components</h2><div class="grid">${comps.map(compCard).join("")}</div>`;
  }
  html += noticesSection(idx, nhits);
  if (prods.total) {
    html += `<h2>Products${prods.total > prods.items.length ? ` <span class="muted small">(first ${prods.items.length} of ${fmt(prods.total)})</span>` : ""}</h2>`;
    html += `<div class="list">${prods.items.map(productCard).join("")}</div>`;
  }
  if (!comps.length && !prods.total && !nhits.length) {
    html += `<p class="muted">Nothing matches “${esc(q)}”. The census only covers commercial products and the components on the
      <a href="${REPO}/blob/main/catalog/components.yaml" target="_blank" rel="noopener">watchlist</a>.
      For open source packages, try <a href="https://deps.dev/" target="_blank" rel="noopener">deps.dev</a> or
      <a href="https://osv.dev/" target="_blank" rel="noopener">OSV.dev</a>.</p>`;
  }
  app.innerHTML = html;
  bindCards();
}

function compCard(c) {
  const incs = (c.incidents || []).map(i => esc(i.name)).join(", ");
  return `<button class="card" data-c="${esc(c.id)}">
    <h3>${esc(c.name)}</h3>
    <div class="small muted">${incs}</div>
    <div class="small" style="margin-top:6px"><b>${fmt(c.products)}</b> products · <b>${fmt(c.contains)}</b> confirmed to contain it</div>
  </button>`;
}
function productCard(p) {
  const comps = Object.entries(p.c || {});
  const vr = new Set(p.vr || []);
  const badges = comps.length
    ? comps.map(([cid, st]) => `<span class="badge v-${esc(vr.has(cid) ? "workaround" : st)}" title="${esc(VERDICTS[st] || st)}">${esc(compName(cid))}: ${esc(vr.has(cid) && st === "present" ? "vulnerable version listed" : (VERDICTS[st] || st))}</span>`).join("")
    : `<span class="small muted">${p.inv ? "No watchlist components listed" : "No composition data yet"}</span>`;
  const facts = [];
  if (p.inv) facts.push(`${fmt(p.inv)} components in vendor notices`);
  if (p.cv) facts.push(`${fmt(p.cv)} CVE${p.cv === 1 ? "" : "s"}${p.kev ? ` · ${fmt(p.kev)} in CISA KEV` : ""}`);
  const spine = facts.length ? `<div class="meta">${facts.join(" · ")}</div>` : "";
  return `<button class="card" data-p="${esc(p.k)}">
    <div class="supplier">${esc(p.s)}</div><div class="product">${esc(p.p)}</div>
    <div class="comp-badges">${badges}</div>${spine}
  </button>`;
}
function compName(id) { const c = META.components.find(x => x.id === id); return c ? c.id : id; }
function bindCards() {

// ---------------------------------------------------------------- component view
async function showComponent(id, filterKey, text) {
  const c = META.components.find(x => x.id === id);

  try { rows = await component(id); }
  catch (e) { app.innerHTML = `<p class="muted">Could not load data for ${esc(c.name)} (${esc(e.message)}).</p>`; return; }
  const filt = FILTERS.find(f => f[0] === filterKey) || FILTERS[0];
  const t = norm(text);
  const visible = rows.filter(r => filt[2](r) && (!t || norm(`${r.s} ${r.p} ${r.v} ${r.pub}`).includes(t)));
  const counts = Object.fromEntries(FILTERS.map(f => [f[0], rows.filter(f[2]).length]));
  statusEl.textContent = `${fmt(visible.length)} of ${fmt(rows.length)} statements shown`;

  const incidents = (c.incidents || []).map(i => `
    <div class="small" style="margin-top:4px"><b>${esc(i.name)}</b> (${esc(i.year)}):
      ${(i.cves || []).map(v => `<a class="cve" href="https://www.cve.org/CVERecord?id=${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`).join(" ")}
      ${(i.trackers || []).map(u => ` · tracker: ${link(u)}`).join("")}
    </div>`).join("");
  app.innerHTML = `
    <button class="back" id="back">← All components</button>
    <h2>${esc(c.name)}</h2>
    <div class="small muted">Upstream: ${link(c.upstream)}${c.purl ? ` · <span class="kbd">${esc(c.purl)}</span>` : ""}</div>
    ${incidents}
    <div class="stats">
      <div class="stat"><b>${fmt(c.products)}</b><span>products with statements</span></div>
      <div class="stat"><b>${fmt(c.contains)}</b><span>confirmed to contain it</span></div>
      <div class="stat"><b>${fmt((c.verdicts || {}).affected || 0)}</b><span>affected, no fix stated</span></div>
      ${c.in_range ? `<div class="stat"><b>${fmt(c.in_range)}</b><span>list a vulnerable version</span></div>` : ""}
    </div>
    <div class="chips" role="group" aria-label="Filter by status">
      ${FILTERS.map(f => `<button class="chip" data-f="${f[0]}" aria-pressed="${f[0] === filt[0]}">${esc(f[1])} <span class="muted">${fmt(counts[f[0]])}</span></button>`).join("")}
    </div>
    <input class="filter" id="tfilter" type="search" placeholder="Filter by vendor or product…" value="${esc(text)}">
    <div class="list" id="rows"></div>
    <button class="chip more" id="more" hidden>Show more</button>`;
  $("#back").addEventListener("click", () => go({}));
  app.querySelectorAll("[data-f]").forEach(el => el.addEventListener("click", () => go({ c: id, f: el.dataset.f, t: $("#tfilter").value.trim() })));
  let tt = null;
  $("#tfilter").addEventListener("input", e => {
    clearTimeout(tt);
    tt = setTimeout(() => go({ c: id, f: filt[0], t: e.target.value.trim() }, true), 200);
  });
  let shown = 0;
  const list = $("#rows"), more = $("#more");
  function page() {
    list.insertAdjacentHTML("beforeend", visible.slice(shown, shown + PAGE).map(r => statementCard(r)).join(""));
    shown = Math.min(shown + PAGE, visible.length);
    more.hidden = shown >= visible.length;
    more.textContent = `Show more (${fmt(visible.length - shown)} left)`;
    list.querySelectorAll("[data-p]:not([data-bound])").forEach(el => {
      el.dataset.bound = "1";
      el.addEventListener("click", ev => { ev.preventDefault(); go({ p: el.dataset.p }); });
    });
  }
  more.addEventListener("click", page);
  if (!visible.length) list.innerHTML = `<p class="muted">No statements match this filter.</p>`;
  else page();
  if (document.activeElement !== $("#tfilter") && text) { const f = $("#tfilter"); f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
}

function statementCard(r, opts = {}) {
  const src = SOURCES[r.src] || { name: r.src };
  const who = r.src === "csaf" ? (r.pub || r.cat || "Vendor") : src.name;
  const cves = Object.entries(r.c || {}).map(([cve, st]) => `<span class="cve" title="${esc(VERDICTS[st] || st)}">${esc(cve)}: ${esc(VERDICTS[st] || st)}</span>`).join("");
  const refs = (r.r || []).map(u => link(u)).join(" · ");
  const head = opts.inProduct
    ? `<div class="small"><b>${esc(who)}</b></div>`
    : `<div class="supplier">${esc(r.s)}</div>
      <a class="product" href="#p=${encodeURIComponent(r.k)}" data-p="${esc(r.k)}">${esc(r.p)}</a>`;
  return `<div class="card">
    <div class="row"><div class="grow">${head}</div>${badge(r.st)}</div>
    ${r.v ? `<div class="meta">${r.e === "notices-file" ? "Product version" : "Versions"}: ${esc(r.v)}</div>` : ""}
    ${r.cv ? `<div class="meta">Component version: <b>${esc(r.cv)}</b></div>` : ""}
    ${r.rc === "in_range" ? `<div class="meta"><span class="badge v-workaround">Vulnerable version listed</span>
      ${esc((r.rcv || []).join(", "))} is in the affected range of ${(r.rcc || []).map(c => `<span class="cve">${esc(c)}</span>`).join(" ")}.
      The vendor may have backported a fix; ask them or check their advisory.</div>` : ""}
    ${r.rc === "outside" ? `<div class="meta">Listed version is outside the affected ranges in the CVE record. Older, end-of-life branches are often missing from those ranges.</div>` : ""}
    ${cves ? `<div class="cves">${cves}</div>` : ""}
    <div class="meta">${esc(EVIDENCE[r.e] || r.e)} · ${link(r.u, who)}${r.d ? ` · as of ${esc(r.d)}` : ""}${r.cat && r.src !== "csaf" ? ` · ${esc(r.cat)}` : ""}</div>
    ${(r.n || refs) ? `<details><summary>Notes and references</summary>
      ${r.n ? `<div class="meta">${esc(r.n)}</div>` : ""}${refs ? `<div class="meta">${refs}</div>` : ""}</details>` : ""}
  </div>`;
}

function downloadCycloneDX(p, d) {
  // A CycloneDX 1.6 BOM built from the vendor's public notices. It is evidence, not a vendor SBOM.
  const uuid = (crypto.randomUUID ? crypto.randomUUID() : "00000000-0000-4000-8000-" + Date.now().toString(16).padStart(12, "0"));
  const bom = {
    bomFormat: "CycloneDX", specVersion: "1.6", serialNumber: `urn:uuid:${uuid}`, version: 1,
    metadata: {
      timestamp: new Date().toISOString(),
      tools: { components: [{ type: "application", name: "Xenolith", externalReferences: [{ type: "website", url: REPO }] }] },
      supplier: { name: p.s },
      component: { type: "application", "bom-ref": "product", name: p.p, version: d.v || undefined, supplier: { name: p.s } },
      properties: [
        { name: "xenolith:evidence", value: "Derived from the vendor's published third-party notices; not a vendor-issued SBOM" },
        { name: "xenolith:source", value: d.u },
        { name: "xenolith:retrieved", value: d.d },
      ],
    },
    components: d.c.map(([n, v], i) => ({ type: "library", "bom-ref": `c${i}`, name: n, ...(v ? { version: v } : {}) })),
    dependencies: [{ ref: "product", dependsOn: d.c.map((_, i) => `c${i}`) }],
  };
  const blob = new Blob([JSON.stringify(bom, null, 2)], { type: "application/vnd.cyclonedx+json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${p.k.replace("/", "_")}${d.v ? "_" + d.v.replace(/[^\w.-]+/g, "_") : ""}.cdx.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

  const { entries, counts, reasons } = WANTED;

        <div class="small">A component list has arrived; see the product page. Remove this entry from <span class="kbd">catalog/wanted.yaml</span> once checked.</div>${verified}</div>`;
    }

function queueSection(queue) {
  if (!queue || !queue.items || !queue.items.length) return "";
  const srcName = Object.fromEntries((queue.sources || []).map(x => [x.id, x]));
  const short = id => ({ kev: "CISA KEV", "gartner-hmf-2025": "Gartner MQ Firewall", "gartner-bdpp-2025": "Gartner MQ Backup",
    "gartner-pam-2025": "Gartner MQ PAM", "gartner-siem-2025": "Gartner MQ SIEM", "gartner-lan-2025": "Gartner MQ LAN",
    "gartner-itsm-2026": "Gartner MQ ITSM", "peer-insights-mft": "Peer Insights / G2 MFT", "g2-remote-support": "G2 Remote Support" })[id] || id;
  const rows = queue.items.map(i => `<div class="card">
      <div class="supplier">${esc(i.s)} · <span class="muted">${esc(i.cat)}</span></div>
      <h3 style="margin:2px 0 4px">${i.k ? `<a href="#p=${encodeURIComponent(i.k)}">${esc(i.p)}</a>` : esc(i.p)}</h3>
      <div class="small"><span class="badge ${i.status === "lead-found" ? "v-present" : i.status === "partial" ? "v-workaround" : "v-unknown"}">${esc(queue.statuses[i.status] || i.status)}</span>
        ${i.kev ? ` <span class="kbd">${fmt(i.kev)} in CISA KEV</span>` : ""}
        ${i.why.filter(w => w !== "kev").map(w => ` <span class="kbd">${esc(short(w))}</span>`).join("")}</div>
      ${i.lead ? `<div class="small muted" style="margin-top:6px">${esc(i.lead)}${i.url ? ` ${link(i.url, "link")}` : ""}</div>` : ""}
    </div>`).join("");
  const srcs = (queue.sources || []).map(x => `<li>${link(x.url, x.name)}</li>`).join("");
  return `<h2>Research queue</h2>
    <p class="small">Widely deployed, customer-run products we haven't researched yet, picked from analyst and review-site
    rankings and from products with actively exploited (CISA KEV) vulnerabilities but no component data. Know where one of
    these vendors publishes its notices? <a href="${REPO}/blob/main/catalog/research_queue.yaml" target="_blank" rel="noopener">catalog/research_queue.yaml</a>.</p>
    <div class="list">${rows}</div>
    <p class="small muted" style="margin-top:10px">Ranking sources:</p><ul class="small">${srcs}</ul>`;

            <span class="track" aria-hidden="true"><span class="fill" style="display:block;width:${(v / 521 * 100).toFixed(1)}%;background:${col}"></span></span>
            <span class="val">${v}</span></div>`).join("")}</div>
          <p class="small muted" style="margin-bottom:0">The corpus includes Splunk Universal Forwarder, Visual Studio Code, Wireshark’s NSIS and MSI installers, Elasticsearch,
          OpenWrt, Debian packages and Python wheels. The misses are libraries with no fingerprint yet, such as libpng, FreeType and OpenLDAP ${ct(24)}.</p></div>
      </div>
    </section>

    <section aria-labelledby="why-action">
      <p class="kicker">Call to action</p><h2 id="why-action">What each of us can do</h2>
      <div class="grid grid3">
        <div class="card"><h3>Vendors</h3><ul class="small">
          <li>Publish an SBOM and VEX for every release at a stable public URL</li>
          <li>Generate SBOMs from the artifact you ship, not only the source tree</li>
          <li>Keep notices in step with builds, and welcome independent checks</li></ul></div>
        <div class="card"><h3>Buyers</h3><ul class="small">
          <li>Ask for public SBOM and VEX in every RFP and renewal</li>
          <li>Give weight to vendors who already publish; ask the rest why not</li>
          <li>Scan what you run and <a href="${REPO}/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener">contribute the results</a> to the census</li></ul></div>
        <div class="card"><h3>Regulators and standards bodies</h3><ul class="small">
          <li>Make publication the default, and justify exceptions narrowly</li>
          <li>Align sectors on one set of minimum elements</li>
          <li>Accept independent verification as evidence</li></ul></div>
      </div>
      <div class="callout"><b>Make day one a lookup, not a scramble.</b> The next Log4Shell is already shipping inside something you run.
        <a href="#" id="why-search" style="color:inherit">Search the census →</a></div>
    </section>

    <section aria-labelledby="why-sources">
      <p class="kicker">References</p><h2 id="why-sources">Sources</h2>
      <ol class="small sources">${WHY_SRC.map(([t, u]) => `<li>${esc(t)}. ${link(u, u.replace(/^https?:\/\//, ""))}</li>`).join("")}</ol>
      <p class="small muted">Facts are current as of ${DECK.date}. Census findings show that a component is present, not that a product is exploitable.
      Product and company names are trademarks of their owners; mentions are factual and imply no endorsement. Recommendations are the author’s own.
      Corrections: <a href="${REPO}/issues" target="_blank" rel="noopener">open an issue</a>.</p>
    </section>
  </article>`;
  $("#why-search").addEventListener("click", e => { e.preventDefault(); go({}); input.focus(); });
}

function renderFooter() {
  const src = META.sources.map(s => `<li>${link(s.url, s.name)} (${esc(s.license)})${s.assertions ? `: ${fmt(s.assertions)} statements` : ""}${s.products ? `: ${fmt(s.products)} products` : ""}${s.latest ? `, latest ${esc(s.latest)}` : ""}</li>`).join("");
  const pubs = (META.sources.find(s => s.id === "csaf") || {}).publishers || {};
  const pubList = Object.keys(pubs).length ? `<p>CSAF publishers so far: ${Object.entries(pubs).map(([n, c]) => `${esc(n)} (${fmt(c)})`).join(", ")}.</p>` : "";
  const comp = META.comparables.map(c => `<li>${link(c.url, c.name)}: ${esc(c.covers)}</li>`).join("");
  $("#footer").innerHTML = `
    <h2>Scope</h2>
    <p>Xenolith covers <b>products</b>: appliances, firmware, enterprise and hosted software, management consoles.
    It doesn't index open source <b>packages</b> (libraries, frameworks, distro packages, base images). These services already do that well:</p>
    <ul>${comp}</ul>
    <h2>Sources</h2><ul>${src}</ul>${pubList}
    <h2>Data and contributions</h2>
    <p>All data is in the repository as NDJSON under <a href="${REPO}/tree/main/data" target="_blank" rel="noopener">data/</a>,
    refreshed daily. Contribute notices links, statements or SBOMs through <a href="${REPO}/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener">pull requests</a>.
    Statements are reproduced from their sources, with links. Always confirm against the vendor's own advisory before you act.</p>
    <p>Built ${esc(META.built)} · <a href="${REPO}" target="_blank" rel="noopener">GitHub</a></p>`;
}

// ---------------------------------------------------------------- boot
(async function boot() {
  try {
    [META, PRODUCTS] = await Promise.all([loadJSON("data/meta.json"), loadJSON("data/products.json")]);
  } catch (e) {
    statusEl.textContent = "Could not load the census data.";
    app.innerHTML = `<p class="muted">${esc(e.message)}</p>`;
    return;
  }
  PINDEX = PRODUCTS.map(p => norm(`${p.s} ${p.p} ${p.k}`));
  for (const p of PRODUCTS) PBYKEY.set(p.k, p);
  for (const s of META.sources) SOURCES[s.id] = s;
  renderFooter();
  route();
})();
</script>
</body>
</html>
