# Evaluation corpus for xenolith-scan: freely downloadable artifacts whose maker states
# what they bundle, so recall can be measured. Keep URLs and hashes here, never binaries.
#
#   xenolith-scan eval scan/corpus/manifest.yaml
#
# inventory: a Xenolith-style inventory JSON ({"components": [{"name", "version"}]}).
# The ones under scan/corpus/truth/ transcribe the maker's own statement (release notes,
# build notes); for products Xenolith already tracks, point at data/notices/<supplier>/*.json.
artifacts:
