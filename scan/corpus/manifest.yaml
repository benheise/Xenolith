    sha256: d0c5516f0aed654134a2fc936325cc2e642f8a0e096d075209672eb321cff408
    supplier: Google
    product: Brotli (Python package)
    version: "1.1.0"
    inventory: scan/corpus/truth/brotli-1.1.0.json
    note: "The wheel statically links the Brotli C library; the version comes from the BrotliDecoderVersion() probe (no version string in the binary)."
