# Vendor third-party notices documents ("Open Source Used In", OSS listings,
# third-party notices, acknowledgments, published SBOMs).
#
# Adding a document is the easiest way to contribute: paste its URL with the
# supplier, product and product version. PDF, HTML, plain text, CycloneDX and
# SPDX all work. The crawler extracts the full component list, stores it under
# data/notices/, and matches it against catalog/components.yaml.
#
# `discover` rules find documents automatically from an index page: `link` is a
# regex on the document URL, `title` a regex on the link text with named groups
# `product` and `version`.
#
# Documents are re-fetched every two weeks; a document whose content hasn't
# changed is not re-parsed.

discover:
  - supplier: Palo Alto Networks
    index: https://docs.paloaltonetworks.com/oss-listings
    link: '/oss-listings/.+/[^/]+oss-listing[^/]*\.html$'
    title: '^(?P<product>.+?)\s+(?P<version>\d[\w.\-]*)\s+OSS Listing$'

  # Elastic publishes a full third-party dependency report per release
  # (Elasticsearch, Kibana, Logstash, Beats, Elastic Agent, Endpoint, ...).
  # Versions come from Elastic's artifacts API; the latest patch of the four
  # newest minors is kept.
  - type: versions_json
    supplier: Elastic
    product: Elastic Stack
    versions_url: https://artifacts-api.elastic.co/v1/versions
    field: versions
    exclude: SNAPSHOT
    keep_latest_per_minor: true
    limit: 4
    url_template: https://artifacts.elastic.co/reports/dependencies/dependencies-{version}.html

  # NetApp publishes a NOTICE report for every release of most products in a
  # plain directory listing: <product>/<version>/NOTICE.pdf. Older releases only
  # have the source archives, whose file names are used instead. The server sends an
  # incomplete certificate chain; catalog/intermediates.pem supplies the missing
  # intermediate.
  - type: autoindex
    supplier: NetApp
    index: https://opensource.netapp.com/
    file: '(?i)^notice[^/]*\.pdf$'
    version: '^v?(?P<v>\d+(?:\.\d+)+(?:P\d+)?)'
    exclude: '(?i)(rc\d*|beta|eap|test|scan|preview|old)'
    latest: 3
    archives: true      # releases without a NOTICE report: list the source archives instead
    products:
      ONTAP: ONTAP
      Data_ONTAP_9: {name: ONTAP, latest: 2}
      Cloud_Volumes_ONTAP: Cloud Volumes ONTAP
      ONTAP_Select: ONTAP Select
      ONTAP_Select_Deploy: ONTAP Select Deploy
      ONTAP_Mediator: ONTAP Mediator
      ONTAP_Tools_for_VMware_vSphere: ONTAP tools for VMware vSphere
      Active_IQ_Unified_Manager: {name: Active IQ Unified Manager, version: '^(?:AIQUM-)?(?P<v>\d+(?:\.\d+)+(?:P\d+)?)'}
      Config_Advisor: Active IQ Config Advisor
      SnapCenter: SnapCenter
      SnapCenter_Plug-in_for_VMware_vSphere: SnapCenter Plug-in for VMware vSphere
      StorageGRID: StorageGRID
      StorageGRID_Webscale: StorageGRID
      ESeries_EFSeries_SANtricity_OS: SANtricity OS
      SANtricity_Web_Services_Proxy: SANtricity Web Services Proxy
      SANtricity_Storage_Manager: SANtricity Storage Manager
      Element_Software: Element Software
      Element_OS: Element Software
      Service_Processor: Service Processor
      MetroCluster_Tiebreaker: MetroCluster Tiebreaker
      Astra_Control_Center: Astra Control Center
      XCP: XCP

  # Extreme Networks lists an "Open Source Declaration" PDF per product release
  # in one table (family | product | version | link). Newest two per product.
  - type: table
    supplier: Extreme Networks
    index: https://www.extremenetworks.com/support/policies/open-source-declaration
    product_column: 1
    version_column: 2
    link: 'sitecorecontenthub\.cloud/api/public/content/|documentation\.extremenetworks\.com/.+\.pdf'
    exclude: '(?i)beta|alpha|\brc\d*'
    latest: 2

  # Veeam's open source page is a product/version picker; the options (with the
  # URL of each version's JSON component list) are embedded in the page.
  - type: embedded_json
    supplier: Veeam
    index: https://www.veeam.com/legal/eula-oss.html
    config: "data-config='(\\{\\s*\"licensesJson\".*?)'"
    list_key: licensesJson
    product_key: product
    versions_key: versions
    version_key: version
    url_key: path
    exclude_products: '(?i)community edition|FREE$'
    latest: 2

