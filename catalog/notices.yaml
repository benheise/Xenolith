# Vendors checked and not crawlable (November 2026):
#   Cisco "Open Source Used In" PDFs: blocked for automated clients (HTTP 403).
#   VMware/Broadcom open_source_licenses.txt: behind the Broadcom support login.
#   Fortinet: exported from the FortiOS GUI (System > Legal Third Party), not published.
#   Splunk: credits PDFs are served through short-lived signed URLs.
#   Juniper: per-release attribution pages stop at Junos 16.1; newer ones moved behind HPE networking docs.
#   SonicWall, Synology, HPE Aruba: no public component lists (GPL source on request or tarballs only).
#   Atlassian: SBOMs ship inside the installation directory only.
#   Adobe: notices PDFs list only attribution-required components, without versions; low value.
#   JetBrains: legal/third-party-software is rendered client-side; needs its JSON endpoint.
#   Check Point: one prose copyright page, no per-product component list.
#   Docker Desktop: acknowledgements only inside the app.
#   Axis: per-model text files exist only for legacy firmware (5.x).
#   Nutanix, Zscaler: no public component lists found.
#   SolarWinds Platform (NPM, SAM, NCM ...): list withdrawn; "request an SBOM". Kiwi pages render client-side.
#   ManageEngine OpManager: thirdparty-library-dependency.html renders client-side.
#   Veritas NetBackup: notices are an HTML book of license texts without versions.
#   Progress MOVEit Transfer: since 2020 only in notice.txt inside the installation.
