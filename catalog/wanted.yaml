# Wanted: products whose component lists we tried to collect and couldn't.
#
# Shown on the site's Wanted page only. Guesses here are NEVER statements: they
# don't appear on product or component pages and don't count as evidence. Their
# purpose is to tell a contributor what to look for, and to rank what to chase.
#
# An entry is fulfilled automatically when Xenolith gets a component list for the
# product (a vendor notices document or a community SBOM); the site then moves it
# to "Now verified". Sourced statements about single components (community/
# assertions.csv, vendor advisories) show up on the entry as already verified.
# Remove an entry once it's fulfilled and checked.
#
# Per vendor:   supplier, blocked (reason code, see REASONS in xenolith/wanted.py),
#               detail (what we tried), where (where the list lives, for whoever has
#               access), products
# Per product:  product, key (Xenolith product key, so the entry links to the existing
#               page), optional blocked/detail/where overrides, guesses
# Per guess:    component (watchlist id) or name (anything else), confidence:
#                 named     the vendor named it publicly (advisory, KB, old notices), but
#                           there's no complete, current list
#                 likely    strong inference (platform, runtime, known architecture)
#                 possible  weaker inference
#               basis (why), optional version and source (https link)

