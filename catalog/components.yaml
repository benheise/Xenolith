    incidents:
      - name: FortiCloud SSO login bypass
        year: 2026
        cves: [CVE-2025-59718, CVE-2026-24858]
        note: >-
          Two ways around the FortiCloud single sign-on admin login, both in CISA KEV. With
          CVE-2025-59718 a forged SAML message logs in with no account (9.1); with
          CVE-2026-24858 anyone with a FortiCloud account and a registered device could log in
          to other customers' devices (9.4). Fortinet found the second being exploited by two
          FortiCloud accounts in January 2026. Only devices with FortiCloud SSO login on are
          exposed: it is off from the factory but is switched on when a device is registered to
