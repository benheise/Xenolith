        year: 2025
        cves: [CVE-2025-20352]
        note: >-
          Stack overflow in the SNMP subsystem of IOS and IOS XE. A crafted SNMP packet from a
          low-privileged user reloads the device; with high privileges it runs code as root
          (7.7). It needs valid SNMP credentials or a community string, and every SNMP version
          is affected. In CISA KEV since 2025-09-29. No workaround; excluding the affected
          OID is the mitigation.
        trackers: []
