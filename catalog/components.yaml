# Component watchlist.
#
# Each entry is a widely embedded third-party component, plus the CVEs that
# identify it. Ingesters use the CVE IDs to recognize when a vendor advisory,
# VEX statement or incident tracker is talking about this component inside
# a commercial product.
#
# To add a component, open a pull request. Required: id, name, cves.
# `purl` and `cpe` describe the upstream component itself (not the products
# that embed it) and are used for cross-referencing only.
#
# `notices_names` are regular expressions matched (case-insensitively, whole
# string) against component names found in vendors' third-party notices and
# SBOMs. An entry can also be {pattern: ..., version: ...} when the name is
# ambiguous and only the version tells components apart (Log4j 1 vs 2).

components:
  - id: php
    name: PHP runtime
    upstream: https://github.com/php/php-src
    purl: pkg:github/php/php-src
    cpe: cpe:2.3:a:php:php
    aliases: [php-src, php-fpm, mod_php, php-cgi]
    notices_names:
      - '^php(?:\d[\d.]*)?$'
      - '^php[-_ ]?(?:src|fpm|cgi|cli|common|embed|libs?|devel)$'
      - '^mod[-_]?php\d*$'
      - '^(?:the )?php (?:group )?php$'
      - '^php[-_ ]?(?:language|runtime|interpreter)$'
    incidents:
      - name: PHP2Shell
        year: 2026
        cves: [CVE-2026-109618, CVE-2026-109619]
        affected:   # [introduced, fixed) from the CVE records' CNA 'affected' data
          - cves: [CVE-2026-109618, CVE-2026-109619]
            ranges:
              - {introduced: '8.2.0', fixed: '8.2.35'}
              - {introduced: '8.3.0', fixed: '8.3.36'}
              - {introduced: '8.4.0', fixed: '8.4.27'}
              - {introduced: '8.5.0', fixed: '8.5.12'}
        trackers:
          - https://github.com/NCSC-NL/php2shell

  - id: brotli
    name: Google Brotli (C library)
    upstream: https://github.com/google/brotli
    purl: pkg:github/google/brotli
    cpe: cpe:2.3:a:google:brotli
    aliases: [libbrotli, brotlidec, node2shell, http2shell, broccoli2shell]
    notices_names:
      - {pattern: '^(?:google[- ])?brotli$', version: '^(?:$|v?0\.|v?1\.[0-2](?:\.|$))'}   # C brotli is 1.0-1.2; ports (npm 1.3.x, Rust 3+) are not it
      - '^libbrotli(?:common|dec|enc)?\d*$'
      - '^brotli[-_ ]?(?:c|lib|libs|cffi|py|python|decoder|common)$'
      - '^brotli(?:cffi|py)$'
      - '^github\.com/google/brotli$'
    incidents:
      - name: Brotli decoder RCE (Node2Shell / HTTP2Shell / Broccoli2Shell)
        year: 2026
        cves: [CVE-2026-111497]
        affected:   # [introduced, fixed) from the CVE records' CNA 'affected' data
          - cves: [CVE-2026-111497]
            ranges:
              - {introduced: '1.0.3', fixed: '1.0.10'}
              - {introduced: '1.1.0', fixed: '1.1.1'}
              - {introduced: '1.2.0', fixed: '1.2.1'}
        trackers:
          - https://broccoli2shell.com/

  - id: react-server-components
    name: React Server Components
    upstream: https://github.com/facebook/react
    purl: pkg:npm/react-server-dom-webpack
    aliases: [react2shell, react-server-dom-webpack, react-server-dom-parcel, react-server-dom-turbopack]
    notices_names:
      - '^react-server-dom-(?:webpack|parcel|turbopack|esm)$'
    incidents:
      - name: React2Shell
        year: 2025
        cves: [CVE-2025-55182]
        affected:   # [introduced, fixed) from the CVE records' CNA 'affected' data
          - cves: [CVE-2025-55182]
            ranges:
              - {introduced: '19.0.0', last_affected: '19.0.0'}
              - {introduced: '19.1.0', last_affected: '19.1.1'}
              - {introduced: '19.2.0', last_affected: '19.2.0'}

  - id: log4j-core
    name: Apache Log4j 2 (log4j-core)
    upstream: https://logging.apache.org/log4j/2.x/
    purl: pkg:maven/org.apache.logging.log4j/log4j-core
    cpe: cpe:2.3:a:apache:log4j
    aliases: [log4j, log4j2, log4shell]
    notices_names:
      - '^log4j[-_ ]?core$'
      - '^log4j[-_ ]?2$'
      - {pattern: '^(?:apache )?log4j(?: 2)?$', version: '^2'}
      - '^org\.apache\.logging\.log4j:log4j-core$'
    incidents:
      - name: Log4Shell
        year: 2021
        cves: [CVE-2021-44228, CVE-2021-45046, CVE-2021-45105, CVE-2021-44832]
        affected:   # [introduced, fixed) from the CVE records' CNA 'affected' data
          - cves: [CVE-2021-44228]
            ranges:
              - {introduced: '2.0-beta9', fixed: '2.3.1'}
              - {introduced: '2.4', fixed: '2.12.2'}
              - {introduced: '2.13.0', fixed: '2.15.0'}
          - cves: [CVE-2021-45046]
            ranges:
              - {introduced: '2.0-beta9', fixed: '2.3.1'}
              - {introduced: '2.4', fixed: '2.12.2'}
              - {introduced: '2.13.0', fixed: '2.16.0'}
          - cves: [CVE-2021-45105]
            ranges:
              - {introduced: '2.0-beta9', fixed: '2.3.1'}
              - {introduced: '2.4', fixed: '2.12.3'}
              - {introduced: '2.13.0', fixed: '2.17.0'}
          - cves: [CVE-2021-44832]
            ranges:
              - {introduced: '2.0-beta7', fixed: '2.3.2'}
              - {introduced: '2.4', fixed: '2.12.4'}
              - {introduced: '2.13.0', fixed: '2.17.1'}
        trackers:
          - https://github.com/NCSC-NL/log4shell
          - https://github.com/cisagov/log4j-affected-db

  - id: log4j-1
    name: Apache Log4j 1.x
    upstream: https://logging.apache.org/log4j/1.x/
    purl: pkg:maven/log4j/log4j
    cpe: cpe:2.3:a:apache:log4j
    aliases: [log4j1, log4j 1.2]
    notices_names:
      - {pattern: '^(?:apache )?log4j$', version: '^1'}
      - '^log4j[-_ ]?1(?:\.\d+)*$'
      - '^log4j:log4j$'
    incidents:
      - name: Log4j 1.x JMSAppender
        year: 2021
        cves: [CVE-2021-4104]
        affected:   # [introduced, fixed) from the CVE records' CNA 'affected' data
          - cves: [CVE-2021-4104]
            ranges:
              - {introduced: '1.2', fixed: '1.3'}

  - id: xz
    name: XZ Utils / liblzma
    upstream: https://github.com/tukaani-project/xz
    purl: pkg:github/tukaani-project/xz
    cpe: cpe:2.3:a:tukaani:xz
    aliases: [liblzma, xz-utils]
    notices_names:
      # bare "xz" only with an XZ Utils version (4.999 or 5.x+); the Java library
      # org.tukaani:xz is also called "xz" but is versioned 1.x
      - {pattern: '^xz$', version: '^(?:[4-9]|\d\d)\.'}
      - '^xz[-_ ]?(?:utils|libs)$'
      - '^liblzma\d*$'
    incidents:
      - name: XZ Utils backdoor
        year: 2024
        cves: [CVE-2024-3094]
        affected:   # [introduced, fixed) from the CVE records' CNA 'affected' data
          - cves: [CVE-2024-3094]
            ranges:
              - {introduced: '5.6.0', fixed: '5.6.2'}

  - id: openssh
    name: OpenSSH (portable)
    upstream: https://www.openssh.com/
    purl: pkg:github/openssh/openssh-portable
    cpe: cpe:2.3:a:openbsd:openssh
    aliases: [sshd, regresshion]
    notices_names:
      - '^openssh(?:[-_ ](?:portable|server|clients|client|sftp-server))?$'
    incidents:
      - name: regreSSHion
        year: 2024
        cves: [CVE-2024-6387]
        affected:   # [introduced, fixed) from the CVE records' CNA 'affected' data
          - cves: [CVE-2024-6387]
            ranges:
              - {introduced: '8.5p1', last_affected: '9.7p1'}

  - id: libwebp
    name: libwebp
    upstream: https://chromium.googlesource.com/webm/libwebp
    purl: pkg:github/webmproject/libwebp
    cpe: cpe:2.3:a:webmproject:libwebp
    aliases: [webp]
    notices_names:
      - '^libwebp\d*$'
      - '^libwebp[-_ ](?:tools|devel)$'
    incidents:
      - name: libwebp heap overflow
        year: 2023
        cves: [CVE-2023-4863]
        affected:   # [introduced, fixed) from the CVE records' CNA 'affected' data
          - cves: [CVE-2023-4863]
            ranges:
              - {introduced: '0', fixed: '1.3.2'}

  - id: curl
    name: curl / libcurl
    upstream: https://curl.se/
    purl: pkg:github/curl/curl
    cpe: cpe:2.3:a:haxx:curl
    aliases: [libcurl]
    notices_names:
      - '^curl$'
      - '^libcurl\d*$'
      - '^(?:lib)?curl[-_ ]minimal$'
      - '^curl[-_ ]libs$'
    incidents:
      - name: curl SOCKS5 heap overflow
        year: 2023
        cves: [CVE-2023-38545]
        affected:   # [introduced, fixed) from the CVE records' CNA 'affected' data
          - cves: [CVE-2023-38545]
            ranges:
              - {introduced: '7.69.0', fixed: '8.4.0'}

  - id: openssl
    name: OpenSSL
    upstream: https://www.openssl.org/
    purl: pkg:github/openssl/openssl
    cpe: cpe:2.3:a:openssl:openssl
    aliases: [libssl, libcrypto]
    notices_names:
      - {pattern: '^openssl$', version: '^(?!v?0\.1\d)'}   # the Rust 'openssl' crate is 0.10.x
      - '^openssl[-_ ](?:libs|fips|toolkit)$'
      - '^libssl\d*(?:\.\d+)*$'
      - '^openssl\d+$'
    incidents:
      - name: OpenSSL 3.0 punycode overflows
        year: 2022
        cves: [CVE-2022-3602, CVE-2022-3786]
        affected:   # [introduced, fixed) from the CVE records' CNA 'affected' data
          - cves: [CVE-2022-3602, CVE-2022-3786]
            ranges:
              - {introduced: '3.0.0', fixed: '3.0.7'}

  - id: spring-framework
    name: Spring Framework
    upstream: https://spring.io/projects/spring-framework
    purl: pkg:maven/org.springframework/spring-beans
    cpe: cpe:2.3:a:vmware:spring_framework
    aliases: [spring4shell, spring-beans]
    notices_names:
      - '^spring[-_ ](?:core|beans|webmvc|web|context|framework|expression|aop)$'
      - '^org\.springframework:spring-(?:core|beans|webmvc|web|context)$'
    incidents:
      - name: Spring4Shell
        year: 2022
        cves: [CVE-2022-22965]
        affected:   # [introduced, fixed) from the CVE records' CNA 'affected' data
          - cves: [CVE-2022-22965]
            ranges:
              - {introduced: '0', fixed: '5.2.20'}
              - {introduced: '5.3.0', fixed: '5.3.18'}

  - id: commons-text
    name: Apache Commons Text
    upstream: https://commons.apache.org/proper/commons-text/
    purl: pkg:maven/org.apache.commons/commons-text
    cpe: cpe:2.3:a:apache:commons_text
    aliases: [text4shell]
    notices_names:
      - '^(?:apache )?commons[-_ ]text$'
      - '^org\.apache\.commons:commons-text$'
    incidents:
      - name: Text4Shell
        year: 2022
        cves: [CVE-2022-42889]
        affected:   # [introduced, fixed) from the CVE records' CNA 'affected' data
          - cves: [CVE-2022-42889]
            ranges:
              - {introduced: '1.5', fixed: '1.10.0'}

  - id: glibc
    name: GNU C Library (glibc)
    upstream: https://www.gnu.org/software/libc/
    purl: pkg:github/bminor/glibc
    cpe: cpe:2.3:a:gnu:glibc
    aliases: [libc, looney tunables]
    notices_names:
      - '^glibc$'
      - '^glibc[-_ ](?:common|devel|minimal-langpack)$'
      - '^gnu c library$'
      - '^libc6$'
    incidents:
      - name: Looney Tunables
        year: 2023
        cves: [CVE-2023-4911]
        affected:   # [introduced, fixed) from the CVE records' CNA 'affected' data
          - cves: [CVE-2023-4911]
            ranges:
              - {introduced: '2.34', fixed: '2.39'}
