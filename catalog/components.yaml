      - name: IOS XE web UI takeover
        year: 2023
        cves: [CVE-2023-20198, CVE-2023-20273]
        note: >-
          Chained in mass compromises in October 2023: CVE-2023-20198 (10.0) creates an
          administrator with no login through the web UI, and CVE-2023-20273 uses that account
          to run commands as root and plant an implant. Both in CISA KEV. Only IOS XE devices
          with the HTTP or HTTPS server feature on are exposed; ip http active-session-modules
          none (and the secure- equivalent) blocks it.
        trackers: []
