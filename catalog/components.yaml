  - id: openjdk
    name: OpenJDK / HotSpot Java runtime (JDK, JRE)
    upstream: https://openjdk.org/
    purl: pkg:github/openjdk/jdk
    cpe: cpe:2.3:a:oracle:openjdk
    aliases: [java4shell, javableed, java runtime, jdk, jre, hotspot, temurin, corretto, zulu, sapmachine, liberica, jetbrains runtime]
    # Java version strings carry build and packaging suffixes (17.0.15+6, 17.0.15_p6,
    # 21.0.7+6~us1); version_style: java drops them before the range check.
    # Distribution build numbers that aren't JDK versions (Zulu 17.70.201) can't be
    # checked. IBM Semeru / OpenJ9 is a different JVM (not HotSpot) and isn't matched.
    version_style: java
    notices_names:
      - '^openjdk(?:[- ]?\d+)?(?:[- ](?:jdk|jre)(?:[- ]headless)?)?$'      # openjdk, openjdk-17, openjdk17, openjdk-15-jre-headless
      - '^openjdk[-/ ](?:zulu|java)$'
      - '^java-\d+(?:\.\d+\.\d+)?-openjdk(?:-headless|-devel)?$'           # RHEL / Fedora packages
      - '^(?:openjdk|java hotspot\(tm\)) 64-bit server vm$'
      - '^unofficial openjdk build$'
      - '^(?:eclipse )?temurin(?:[- ]?\d+)?(?: (?:jdk|jre))?$'
      - '^adoptium/temurin\d+-binaries(?:jdk|jre)?$'
      - '^adoptopenjdk(?:[- ]?\d+)?(?:[- ](?:jdk|jre))?(?:[- ]hotspot)?$'
      - '^(?:amazon )?corretto(?:[-/ ]corretto)?(?:[- ]?\d+)?$'
      - '^java-\d+-amazon-corretto(?:-headless|-devel)?$'
      - '^(?:azul )?zulu(?: (?:jdk|jre|openjdk))?(?:[- ]?\d+)?$'
      - '^zulu builds of openjdk(?: for (?:windows|linux|macos))?$'
      - '^(?:bell-sw/|bellsoft )?liberica(?: (?:jdk|jre))?(?:[- ]?\d+)?$'
      - '^sapmachine(?:[- ]?\d+)?(?: (?:jdk|jre))?(?: sapmachine-\d[\d.]*)?$'
      - '^(?:microsoft build of openjdk|msopenjdk)(?:[- ]?\d+)?$'
      - '^red hat build of openjdk(?: \d+)?$'
      - '^(?:oracle )?graalvm(?: (?:for jdk|community edition|enterprise edition|ce|ee))?(?:[- ]?\d+)?$'
      - '^(?:bundled )?(?:oracle |sun )?java(?:\(tm\))?(?: se)? (?:runtime environment|development kit|jre|jdk)$'
      - '^java runtime(?: environment)?$'
      - '^(?:sun )?java platform standard edition(?: sdk)? \((?:jre|j2sdk)\) \((?:j2re|jdk)\)$'
      - '^(?:jre|jdk)(?:[- ]?\d+(?:u\d*)?)?$'
      - '^(?:jetbrains runtime|jbr)(?:[- ]?\d+)?$'                       # JetBrains' OpenJDK build in its IDEs
    incidents:
      - name: Java4Shell (HotSpot AVX-512 Base64 decoder heap overflow)
        year: 2026
        cves: [CVE-2026-114938]
        # From the OpenJDK Vulnerability Group advisory of 2026-11-17 and Oracle's November
        # 2026 Critical Security Patch Update. The AVX-512 decoder arrived in JDK 18 and was
        # backported to 17.0.6; non-LTS 18-20, 22-24 and 26 are affected and end of life.
        # Only exploitable on x86-64 CPUs with AVX-512 VBMI; Java 8 and 11 are not affected.
        # Oracle's Java 8 performance builds (8u511b33-perf) are also affected but can't be
        # told apart from ordinary 8u builds by version string, so they aren't ranged here.
        # The CVE record also lists GraalVM for JDK 17.0.21.0.3 and 21.0.13.0.3 (covered by
        # the ranges) and GraalVM Enterprise Edition 21.3.20.0.3, which has its own numbering.
        note: >-
          Only on x86-64 CPUs with AVX-512 VBMI (Intel Ice Lake and later Xeons and some Core
          chips, AMD Zen 4 and later); ARM64 is not affected. Also affected: Oracle Java SE 8
          Enterprise Performance Pack 8u511b33-perf (fixed in 8u513-perf) and GraalVM
          Enterprise Edition 21.3.20.0.3. Interim mitigations (either one):
          -XX:-UseBASE64Intrinsics (preferred; VulnCheck tested it with
          -XX:+UnlockDiagnosticVMOptions ahead of it), or -XX:UseAVX=2 on x86-64 hosts only,
          since JVMs on ARM64 fail to start with it. A proof of concept that triggers the bug is
          public, and probing and exploit attempts have been seen since 18 November (GreyNoise,
          watchTowr); no confirmed compromise and not in CISA KEV as of 2026-11-19.
        affected:
          - cves: [CVE-2026-114938]
            ranges:
              - {introduced: '17.0.6', fixed: '17.0.21.1'}
              - {introduced: '18', fixed: '21.0.13.1'}
              - {introduced: '22', fixed: '25.0.5.1'}
              - {introduced: '26', fixed: '27.0.1.1'}
        trackers: []

  # Added November 2026 from a research pass on components that are bundled privately inside
  # appliances and enterprise servers (so OS patching doesn't reach them) and have a named or
  # CISA KEV-listed incident. Ranges come from the CVE records' CNA 'affected' data (or the
  # project's own advisory where the CNA record has none, as noted).

  - id: nginx
    name: nginx
    upstream: https://nginx.org/
    purl: pkg:generic/nginx
    cpe: cpe:2.3:a:f5:nginx
    aliases: [nginx open source, NGINX2Root]
    notices_names:
      - '^nginx$'
      - '^nginx[-_ ](?:bin|core|full|light|extras|mainline|stable)$'
      - '^nginx/nginx$'
    incidents:
      - name: NGINX2Root
        year: 2026
        cves: [CVE-2026-123007, CVE-2026-123634, CVE-2026-123633, CVE-2026-121810, CVE-2026-113425]
        # F5's CVE records of 2026-11-18: affected from the version that added each module,
        # fixed in 1.30.7 (stable) and 1.31.9 (mainline); older lines get no fix.
        note: >-
          CVE-2026-123007 (HTTP/2, unauthenticated) is the remote code execution entry point;
          the disclosure chains it with an unpatched Linux kernel SCTP bug to reach root.
          Disabling HTTP/2 blocks only CVE-2026-123007 and CVE-2026-123633. A proof of concept
          for CVE-2026-123007 is public (Rapid7); not in CISA KEV as of 2026-11-19.
        affected:
          - cves: [CVE-2026-123007]
            ranges:
              - {introduced: '1.9.5', fixed: '1.30.7'}
              - {introduced: '1.31.0', fixed: '1.31.9'}
          - cves: [CVE-2026-123634]
            ranges:
              - {introduced: '0.6.18', fixed: '1.30.7'}
              - {introduced: '1.31.0', fixed: '1.31.9'}
          - cves: [CVE-2026-123633]
            ranges:
              - {introduced: '1.19.7', fixed: '1.30.7'}
              - {introduced: '1.31.0', fixed: '1.31.9'}
          - cves: [CVE-2026-121810]
            ranges:
              - {introduced: '1.25.0', fixed: '1.30.7'}
              - {introduced: '1.31.0', fixed: '1.31.9'}
          - cves: [CVE-2026-113425]
            ranges:
              - {introduced: '0.5.33', fixed: '1.30.7'}
              - {introduced: '1.31.0', fixed: '1.31.9'}
        trackers: []

