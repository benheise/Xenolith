# Research queue: widely deployed, customer-run products to look into next.
#
# Picked from analyst and review-site rankings (Gartner Magic Quadrants and Peer
# Insights, G2 Grids) and from Xenolith's own registry: products with entries in
# the CISA KEV catalog and no component data yet. SaaS-only products are left out,
# because their composition can't be checked by customers.
#
# This is a to-do list, not data. When a product's public list is found, add it to
# notices.yaml; when it turns out to be blocked, move it to wanted.yaml with guesses.
# The site shows the queue on the Wanted page, with KEV counts filled in from the
# registry by key.
#
# Per entry: supplier, product, key (registry key, for the KEV count and link),
#   category, why (market source or exploitation), status, lead (where to start).
# status:  lead-found      a public list or a likely source exists; parse it next
#          partial         something public, but incomplete or hard to get
#          nothing-found   searched, found nothing public
#          not-checked     not searched yet

sources:
  - id: gartner-hmf-2025
    name: "2025 Gartner Magic Quadrant for Hybrid Mesh Firewall (Leaders: Palo Alto Networks, Fortinet, Check Point)"
    url: https://www.checkpoint.com/press-releases/check-point-named-a-leader-in-the-2025-gartner-magic-quadrant-for-hybrid-mesh-firewall/
  - id: gartner-bdpp-2025
    name: "2025 Gartner Magic Quadrant for Backup and Data Protection Platforms (Leaders: Veeam, Commvault, Rubrik, Cohesity, Dell, Druva)"
    url: https://www.gartner.com/en/documents/6640734
  - id: gartner-pam-2025
    name: "2025 Gartner Magic Quadrant for Privileged Access Management (Leaders: BeyondTrust, CyberArk, Delinea; ManageEngine evaluated)"
    url: https://www.gartner.com/doc/7051198
  - id: gartner-siem-2025
    name: "2025 Gartner Magic Quadrant for SIEM (Leaders include Splunk, Google, Exabeam, Gurucul; Fortinet a Challenger)"
    url: https://www.splunk.com/goto/gartner_report
  - id: gartner-lan-2025
    name: "2025 Gartner Magic Quadrant for Enterprise Wired and Wireless LAN Infrastructure (Leaders: Fortinet, HPE Aruba, Huawei, Juniper)"
    url: https://www.juniper.net/gb/en/reports/gartner/magic-quadrant-for-enterprise-wired-and-wireless-lan-infrastructure/thank-you.html
  - id: gartner-itsm-2026
    name: "2026 Gartner Magic Quadrant for IT Service Management Platforms (evaluated: Atlassian, BMC Helix, EasyVista, Freshworks, Halo, Ivanti, ManageEngine, Matrix42, OpenText, Salesforce, ServiceNow, SymphonyAI, SysAid, TeamDynamix, TOPdesk, Xurrent)"
    url: https://www.gartner.com/en/documents/8168829
  - id: peer-insights-mft
    name: "Gartner Peer Insights and G2: Managed File Transfer (GoAnywhere, Progress MOVEit, Axway MFT, Globalscape, Cleo, JSCAPE, Kiteworks)"
    url: https://www.gartner.com/reviews/product/goanywhere-managed-file-transfer/alternatives
  - id: g2-remote-support
    name: "G2 Remote Support and Remote Desktop Grids (TeamViewer, AnyDesk, ScreenConnect, BeyondTrust Remote Support, Zoho Assist, Splashtop)"
    url: https://www.g2.com/products/beyondtrust-remote-support/competitors/alternatives
  - id: kev
    name: "Xenolith registry: products with CISA KEV entries and no component data"
    url: https://benheise.github.io/Xenolith/

